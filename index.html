<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheris FPS Room Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="roomCode" class="room-code hidden"></div>

  <main id="menu" class="screen">
    <section id="centerStart" class="center-start">
      <h1>AETHERIS</h1>
      <p>가운데를 눌러 시작</p>
    </section>
    <section id="roomPanel" class="room-panel hidden">
      <div class="create-options">
        <label>최대 인원
          <select id="maxPlayers">
            <option value="2">2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
          </select>
        </label>
        <label>모드
          <select id="gameMode">
            <option value="ffa">개인전</option>
            <option value="team">랜덤팀전</option>
          </select>
        </label>
        <label>라운드
          <input id="roundCount" type="number" min="8" max="20" value="8">
        </label>
      </div>
      <div class="room-actions">
        <button id="createRoom">방 만들기</button>
        <button id="openJoin">방 참여</button>
      </div>
      <form id="joinForm" class="join-form hidden">
        <input id="joinCode" maxlength="6" autocomplete="off" placeholder="참여 코드">
        <button>입장</button>
      </form>
      <p id="menuMessage"></p>
    </section>
  </main>

  <section id="lobby" class="screen hidden">
    <div class="box">
      <h2>대기실</h2>
      <p id="lobbyInfo"></p>
      <div id="lobbyPlayers" class="player-list"></div>
      <button id="startRoom" class="hidden">전투 시작</button>
      <p id="lobbyMessage"></p>
    </div>
  </section>

  <section id="selectScreen" class="screen hidden">
    <div class="box wide">
      <div class="top-line">
        <h2>초기 능력카드 선택</h2>
        <b id="selectTimer">10</b>
      </div>
      <p>처음 한 번만 뜹니다. 모두 선택하거나 제한시간이 끝나면 랜덤 선택 후 시작됩니다.</p>
      <div id="elements" class="grid cards-grid"></div>
      <div id="selectStatus"></div>
    </div>
  </section>

  <section id="upgradeScreen" class="screen hidden">
    <div class="box wide">
      <div class="top-line">
        <h2 id="upgradeTitle">강화 선택</h2>
        <b id="upgradeTimer">선택 후 3초</b>
      </div>
      <p id="upgradeDesc"></p>
      <div id="upgradeOptions" class="grid cards-grid"></div>
      <div id="upgradeStatus"></div>
    </div>
  </section>

  <section id="hud" class="hud hidden">
    <div class="top-hud">
      <div class="bars">
        <div><span>HP</span><b id="hpText">100</b><em><i id="hpBar"></i></em></div>
        <div><span>MANA</span><b id="manaText">30</b><em><i id="manaBar"></i></em></div>
        <div><span>ROUND</span><b id="roundText">1 / 8</b><em><i id="roundBar"></i></em></div>
      </div>
      <div id="scoreboard" class="scoreboard"></div>
    </div>
    <div id="cards" class="cards"></div>
    <div class="help">WASD 이동 · 마우스 고정 · 좌클릭 카드 사용 · 우클릭 마나 모으기 · Shift 대쉬 · Space 점프 · 1~4 카드 변경</div>
    <div id="log" class="log"></div>
    <div id="crosshair"></div>
  </section>

  <section id="endScreen" class="screen hidden">
    <div class="box">
      <h2 id="endTitle">게임 종료</h2>
      <div id="finalScores" class="player-list"></div>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
